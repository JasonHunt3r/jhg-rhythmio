# One Xcode project for both app bundles (spec/xcode-port.md).
#
# Everything real stays SwiftPM — RhythmIOCore, RhythmIOPlayback,
# RhythmBGCore, mio and the tests are built and tested with `swift test`.
# Only the bundles are built here, because a Control Center extension has
# to be a real Xcode target to register:
#
#   RhythmIO.app
#     Contents/PlugIns/RhythmBGControls.appex   the tiles
#     Contents/Library/LoginItems/RhythmBG.app  the desktop player
#     Contents/Resources/Fonts/Bravura.otf
#
# Nesting was measured with tools/nest-probe: a tile in the host reaches
# the nested helper by URL, and SMAppService registers it at login.
#   ./make-app.sh   → build/RhythmIO.app
name: RhythmIO
options:
  bundleIdPrefix: com.jhg
  deploymentTarget:
    macOS: "14.0"
packages:
  RhythmIO:
    path: .
  PaneKit:
    path: PaneKit
  ListKit:
    path: ListKit
settings:
  base:
    # Signed as Jason's own Apple Development identity (a free Personal
    # Team, 2026-09-26), not ad hoc: a permission granted to an ad-hoc app
    # (Accessibility, for ending tap-to-drag's hold) is lost at every
    # rebuild, since it's tied to that exact build. No provisioning
    # profile is needed — the only entitlements are the tile's sandbox
    # and a read-only path.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: P82S39V2KJ
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: NO
    # Bump when a tile is added or renamed: Control Center caches them
    # (spec/xcode-port.md, "Caches lie").
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "0.1"
targets:
  # The app. Its sources are the package's RhythmIOApp target, built here
  # instead of by SwiftPM so the bundle is a real one.
  RhythmIO:
    type: application
    platform: macOS
    sources:
      - path: Sources/RhythmIOApp
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The app icon: an Icon Composer document (open it in Icon Composer
      # to edit), made by Jason for the rename to RhythmIO.
      - path: Resources/RhythmIO.icon
    dependencies:
      - package: RhythmIO
        product: RhythmIOCore
      - package: RhythmIO
        product: RhythmIOPlayback
      # Play on Desktop names monitors as RhythmBG does (B-17).
      - package: RhythmIO
        product: RhythmBGCore
      - package: PaneKit
        product: PaneKit
      - package: ListKit
        product: ListKit
      - target: RhythmBGControls
        embed: true
      - target: RhythmBG
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhg.rhythmio
        ASSETCATALOG_COMPILER_APPICON_NAME: RhythmIO
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Sources/RhythmIOApp/Info.plist
      properties:
        CFBundleDisplayName: RhythmIO
        LSMinimumSystemVersion: "14.0"
        # rhythmio://settings/rhythmbg: RhythmBG's "Open at Login…" (B-87).
        CFBundleURLTypes:
          - CFBundleURLName: com.jhg.rhythmio
            CFBundleURLSchemes: [rhythmio]
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        # Bravura, the music font, loaded for this app alone.
        ATSApplicationFontsPath: Fonts
        # Files dragged within the app (from the Collection Browser).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jhg.rhythmio.items
            UTTypeDescription: RhythmIO library files
            UTTypeConformsTo: [public.data]

  # The desktop player, nested in RhythmIO above (spec/rhythmbg.md).
  RhythmBG:
    type: application
    platform: macOS
    sources: [RhythmBG/App]
    dependencies:
      - package: RhythmIO
        product: RhythmIOCore
      - package: RhythmIO
        product: RhythmIOPlayback
      - package: RhythmIO
        product: RhythmBGCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhg.rhythmbg
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    info:
      path: RhythmBG/App/Info.plist
      properties:
        CFBundleDisplayName: RhythmBG
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jhg.rhythmbg
            CFBundleURLSchemes: [rhythmbg]

  # The Control Center tiles. An extension's id must sit under its host's,
  # so this is com.jhg.rhythmio.bgcontrols, not …rhythmbg.controls; the
  # tiles' `kind` strings are unchanged, so their state carries over.
  RhythmBGControls:
    type: app-extension
    platform: macOS
    sources: [RhythmBG/Controls]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhg.rhythmio.bgcontrols
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RhythmBG
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    info:
      path: RhythmBG/Controls/Info.plist
      properties:
        CFBundleDisplayName: RhythmBG
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RhythmBG/Controls/RhythmBGControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Reads the on/off state RhythmBG writes for the tiles; nothing else.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/RhythmBG/
